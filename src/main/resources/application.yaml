spring:
  application:
    name: iam-service
  profiles:
    active: dev
  mvc:
    servlet:
      path: /api/v1
  #Temporal exclusion of DataSourceAutoConfiguration to avoid startup failure due to missing DB configuration
  #  autoconfigure:
  #    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:shiva_banking} # Default to local DB for development
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari: # HikariCP settings for connection pooling, it helps managing DB connections efficiently
      pool-name: IamSvcHikariCP
      maximum-pool-size: 10 # max connections in pool, adjust based on app load
      minimum-idle: 5 # keep at least this many idle connections
      idle-timeout: 30000 # 30 seconds before an idle connection is closed
      max-lifetime: 600000 # recycle connections every 10 minutes
      connection-timeout: 30000 # 30 seconds max wait for a connection
  config:
    import: optional:file:.env

    # Redis configuration for rate limiting and caching
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  #Tell Hibernate to validate the schema against the entities. ddl-auto can be set to 'update', 'create', 'create-drop', 'validate', 'none'
  jpa:
    hibernate:
      ddl-auto: validate # Ensure DB schema matches entities, don't auto-change
    #The open-in-view setting controls whether the Hibernate session is kept open during the entire request. This is useful for lazy loading.
    #$user = User::first();
    #$user->posts;
    open-in-view: false # Don't keep DB session open across the whole request
    properties:
      hibernate:
        default_schema: iam_service
        jdbc:
          timezone: Africa/Nairobi # Set JDBC timezone to Africa/Nairobi

  messages:
    basename: messages,ValidationMessages
    encoding: UTF-8
    fallback-to-system-locale: false

  liquibase:
    enabled: true
    liquibase-schema: public
    default-schema: iam_service
    change-log: classpath:db/changelog/db.changelog-master.yaml

#  web:
#    resources:
#      add-mappings: true # Enable static resource handling for Swagger UI

encryption:
  key: ${APP_KEY}

# CORS Configuration
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}

# GeoIP Configuration for IP geolocation
geoip:
  database:
    path: ${GEOIP_DATABASE_PATH:/usr/local/share/GeoIP/GeoLite2-City.mmdb}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers

  #  endpoint:
  #    health:
  #      show-details: always
  health:
    redis:
      enabled: false

# Rate Limiting Configuration
shiva:
  rate-limit:
    enabled: true
    storage: REDIS
    default-limit:
      capacity: 100
      refill-tokens: 100
      refill-duration: PT1M  # 1 minute
    whitelisted-ips:
      - "127.0.0.1"
      - "::1"
    blacklisted-ips: [ ]
    custom-header-name: "X-API-Key"
    penalty:
      enabled: true
      violation-threshold: 10
      blacklist-duration: PT15M  # 15 minutes
      violation-window: PT1M  # 1 minute

  # Security Headers Configuration
  security:
    jwt:
      public-key: ${SHIVA_SECURITY_JWT_PUBLIC_KEY}
      private-key: ${SHIVA_SECURITY_JWT_PRIVATE_KEY}
    spa:
      public-key: ${SHIVA_SECURITY_SPA_PUBLIC_KEY}
      private-key: ${SHIVA_SECURITY_SPA_PRIVATE_KEY}
    headers:
      enabled: true
      x-frame-options: true
      x-frame-options-value: DENY
      x-content-type-options: true
      x-xss-protection: true
      hsts: true
      hsts-max-age: 31536000  # 1 year
      hsts-preload: false
      csp: true
      csp-directives: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'"
      referrer-policy: true
      referrer-policy-value: "strict-origin-when-cross-origin"
      permissions-policy: true
      permissions-policy-value: "geolocation=(), microphone=(), camera=()"
      x-permitted-cross-domain-policies: true
      remove-server-header: true
      x-download-options: true

    # Request Signature Validation (for mobile/external APIs)
    signature:
      enabled: true
      secret-key: ${SIGNATURE_SECRET_KEY:change-this-secret-key-in-production}
      algorithm: HmacSHA256

# System properties to prevent internet access attempts
system:
  properties:
    java.net.useSystemProxies: false
    java.net.preferIPv4Stack: true
