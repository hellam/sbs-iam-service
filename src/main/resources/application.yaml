spring:
  application:
    name: iam-service
  profiles:
    active: dev
  mvc:
    servlet:
      path: /api/v1/oauth
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:shiva_banking} # Default to local DB for development
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: IamSvcHikariCP
      maximum-pool-size: 50 # max connections in pool, adjust based on app load
      minimum-idle: 10 # keep at least this many idle connections
      idle-timeout: 30000 # 30 seconds before an idle connection is closed
      max-lifetime: 600000 # recycle connections every 10 minutes
      connection-timeout: 30000 # 30 seconds max wait for a connection
  config:
    import: optional:file:.env

    # Redis configuration for rate limiting and caching
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 50           # Increased matching DB pool
          max-idle: 20
          min-idle: 5
          max-wait: -1ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: iam_service
        jdbc:
          timezone: Africa/Nairobi # Set JDBC timezone to Africa/Nairobi
          batch_size: 50           # Enable batching for inserts
          order_inserts: true
          order_updates: true

  messages:
    basename: messages,ValidationMessages
    encoding: UTF-8
    fallback-to-system-locale: false

  liquibase:
    enabled: true
    liquibase-schema: public
    default-schema: iam_service
    change-log: classpath:db/changelog/db.changelog-master.yaml
#    database-change-log-lock-table: iam_service_database_change_log_lock
#    database-change-log-table: iam_service_database_change_log

encryption:
  key: ${APP_KEY}

# GeoIP Configuration for IP geolocation
geoip:
  database:
    path: ${GEOIP_DATABASE_PATH:/usr/local/share/GeoIP/GeoLite2-City.mmdb}

server:
  tomcat:
    threads:
      max: 200                     # Ensure Tomcat can handle incoming requests
      min-spare: 20
    connection-timeout: 20000      # 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  health:
    redis:
      enabled: false

# Rate Limiting Configuration
shiva:
  auth:
    generated-password:
      mode: ${SHIVA_GENERATED_PASSWORD_MODE:NUMERIC}
      length: ${SHIVA_GENERATED_PASSWORD_LENGTH:8}

  rate-limit:
    enabled: true
    storage: REDIS
    default-limit:
      capacity: 100
      refill-tokens: 100
      refill-duration: PT1M  # 1 minute
    whitelisted-ips:
      - "127.0.0.1"
      - "::1"
    blacklisted-ips: [ ]
    custom-header-name: "X-API-Key"
    penalty:
      enabled: true
      violation-threshold: 10
      blacklist-duration: PT15M  # 15 minutes
      violation-window: PT1M  # 1 minute

  # Security Headers Configuration
  security:
    jwt:
      enabled: false
      public-key: ${SHIVA_SECURITY_JWT_PUBLIC_KEY}
      private-key: ${SHIVA_SECURITY_JWT_PRIVATE_KEY}
      expected-issuer: sbs-iam
      expected-audience: gateway-service
    downstream-jwt:
      expected-issuer: https://gateway.service
      expected-audience: iam-service
      public-key: ${SHIVA_DOWNSTREAM_JWT_PUBLIC_KEY}
    spa:
      public-key: ${SHIVA_SECURITY_SPA_PUBLIC_KEY}
      private-key: ${SHIVA_SECURITY_SPA_PRIVATE_KEY}

    # Request Signature Validation (for mobile/external APIs)
    signature:
      enabled: true
      secret-key: ${SIGNATURE_SECRET_KEY:change-this-secret-key-in-production}
      algorithm: HmacSHA256

    risk:
      impossible-travel:
        enabled: ${IMPOSSIBLE_TRAVEL_DETECTION:true}                     # Master switch for impossible-travel controls
        lookback-hours: 24                # Compare against last successful login within this window
        min-distance-km: 500              # Minimum geo distance before speed rule applies
        speed-threshold-kmh: 900          # Above this calculated speed => suspicious
        country-jump-window-minutes: 45   # Different-country jump within this window => suspicious
      user-agent-drift:
        enabled: ${USER_AGENT_DRIFT_DETECTION:false}                # Additional heuristic using existing login/device data
        window-minutes: 3                # Only evaluate drift if previous login is recent

    retention:
      enabled: true                       # Scheduled cleanup to cap DB growth
      cleanup-cron: "0 30 2 * * *"       # Daily at 02:30 server time
      revoked-tokens-grace-days: 2        # Keep short grace after token expiry for forensics
      refresh-tokens-days: 30             # Purge expired refresh token rows older than this
      session-events-days: 180            # Operational session events retention
      security-events-days: 365           # Security events retention
      login-history-days: 365             # Login history retention

    session-revocation:
      redis-prefix: "iam:revoked-session:"  # Shared Redis key prefix consumed by gateway
    session-version:
      redis-prefix: "iam:session-version:"  # Shared Redis key prefix for current per-session version
    session:
      single-active-per-user:
        enabled: true                      # If true, new LOGIN_ACTIVE issuance revokes other active login sessions
    refresh:
      replay-grace-seconds: ${SHIVA_SECURITY_REFRESH_REPLAY_GRACE_SECONDS:5}  # short grace for same-device concurrent refresh
    totp:
      issuer: ${SHIVA_SECURITY_TOTP_ISSUER:Shiva Banking}
      time-step-seconds: ${SHIVA_SECURITY_TOTP_TIME_STEP_SECONDS:30}
      allowed-past-windows: ${SHIVA_SECURITY_TOTP_ALLOWED_PAST_WINDOWS:1}
      allowed-future-windows: ${SHIVA_SECURITY_TOTP_ALLOWED_FUTURE_WINDOWS:0}
      secret-bytes: ${SHIVA_SECURITY_TOTP_SECRET_BYTES:20}

  #Service Configuration
  services:
    account:
      url: ${ACCOUNTS_SERVICE_URL:http://localhost:9002/api/v1/accounts}
  # Notification Client Configuration
  notification:
    client:
      url: ${NOTIFICATION_SERVICE_URL:http://localhost:9003}
      kafka-topic: ${NOTIFICATION_KAFKA_TOPIC:notifications.bulk.v1}
      timeout: ${NOTIFICATION_TIMEOUT:15} # in seconds
      kafka:
        enabled: false
      enabled: true

analytics:
  events:
    enabled: ${ANALYTICS_EVENTS_ENABLED:true}
    topic: ${ANALYTICS_EVENTS_TOPIC:analytics.dashboard.snapshot.v1}
    snapshot-cron: ${ANALYTICS_EVENTS_SNAPSHOT_CRON:0 */1 * * * *}

logging:
  level:
    ke.shiva.client.notification: DEBUG
