spring:
  application:
    name: iam-service
  profiles:
    active: dev
  mvc:
    servlet:
      path: /api/v1/oauth  # Base path for all MVC controllers
  #Temporal exclusion of DataSourceAutoConfiguration to avoid startup failure due to missing DB configuration
  #  autoconfigure:
  #    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:shiva_banking} # Default to local DB for development
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari: # HikariCP settings for connection pooling, it helps managing DB connections efficiently
      pool-name: IamSvcHikariCP
      maximum-pool-size: 50 # max connections in pool, adjust based on app load
      minimum-idle: 10 # keep at least this many idle connections
      idle-timeout: 30000 # 30 seconds before an idle connection is closed
      max-lifetime: 600000 # recycle connections every 10 minutes
      connection-timeout: 30000 # 30 seconds max wait for a connection
  config:
    import: optional:file:.env

    # Redis configuration for rate limiting and caching
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      lettuce:
        pool:
          max-active: 50           # Increased matching DB pool
          max-idle: 20
          min-idle: 5
          max-wait: -1ms

  #Tell Hibernate to validate the schema against the entities. ddl-auto can be set to 'update', 'create', 'create-drop', 'validate', 'none'
  jpa:
    hibernate:
      ddl-auto: validate # Ensure DB schema matches entities, don't auto-change
    #The open-in-view setting controls whether the Hibernate session is kept open during the entire request. This is useful for lazy loading.
    #$user = User::first();
    #$user->posts;
    open-in-view: false # Don't keep DB session open across the whole request
    properties:
      hibernate:
        default_schema: iam_service
        jdbc:
          timezone: Africa/Nairobi # Set JDBC timezone to Africa/Nairobi
          batch_size: 50           # Enable batching for inserts
          order_inserts: true
          order_updates: true

  messages:
    basename: messages,ValidationMessages
    encoding: UTF-8
    fallback-to-system-locale: false

  liquibase:
    enabled: true
    liquibase-schema: public
    default-schema: iam_service
    change-log: classpath:db/changelog/db.changelog-master.yaml
#    database-change-log-lock-table: iam_service_database_change_log_lock
#    database-change-log-table: iam_service_database_change_log

#  web:
#    resources:
#      add-mappings: true # Enable static resource handling for Swagger UI

encryption:
  key: ${APP_KEY}

iam:
  task-roles:
    labels:
      MAKER: Maker
      CHECKER: Checker
      APPROVER: Approver
    descriptions:
      MAKER: Creates and submits transaction instructions for review.
      CHECKER: Reviews and verifies submitted transaction instructions.
      APPROVER: Performs final approval before transaction execution.

# GeoIP Configuration for IP geolocation
geoip:
  database:
    path: ${GEOIP_DATABASE_PATH:/usr/local/share/GeoIP/GeoLite2-City.mmdb}

server:
  tomcat:
    threads:
      max: 200                     # Ensure Tomcat can handle incoming requests
      min-spare: 20
    connection-timeout: 20000      # 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers

  #  endpoint:
  #    health:
  #      show-details: always
  health:
    redis:
      enabled: false

# Rate Limiting Configuration
shiva:
  rate-limit:
    enabled: true
    storage: REDIS
    default-limit:
      capacity: 100
      refill-tokens: 100
      refill-duration: PT1M  # 1 minute
    whitelisted-ips:
      - "127.0.0.1"
      - "::1"
    blacklisted-ips: [ ]
    custom-header-name: "X-API-Key"
    penalty:
      enabled: true
      violation-threshold: 10
      blacklist-duration: PT15M  # 15 minutes
      violation-window: PT1M  # 1 minute

  # Security Headers Configuration
  security:
    jwt:
      public-key: ${SHIVA_SECURITY_JWT_PUBLIC_KEY}
      private-key: ${SHIVA_SECURITY_JWT_PRIVATE_KEY}
      expected-issuer: https://sbs.iam
      expected-audience: gateway-service
    downstream-jwt:
      expected-issuer: https://gateway.service
      expected-audience: integration-service
      public-key: ${SHIVA_DOWNSTREAM_JWT_PUBLIC_KEY}
    spa:
      public-key: ${SHIVA_SECURITY_SPA_PUBLIC_KEY}
      private-key: ${SHIVA_SECURITY_SPA_PRIVATE_KEY}

    # Request Signature Validation (for mobile/external APIs)
    signature:
      enabled: true
      secret-key: ${SIGNATURE_SECRET_KEY:change-this-secret-key-in-production}
      algorithm: HmacSHA256

  corebanking:
    enabled: true
    provider: BRNET  # or MOCK for testing
    timeout-seconds: 30
    cache:
      enabled: false
      client-details-ttl-minutes: 30
      account-details-ttl-minutes: 30
      account-balance-ttl-minutes: 5

    # BR.NET Configuration
    brnet:
      connection-string: ${BRNET_CONNECTION_STRING}
      base-url: ${BRNET_BASE_URL}
      action: http://www.craftsilicon.com/banking/core
      token-cache-ttl-minutes: 0
      token-refresh-threshold-minutes: 1
      request-timeout-seconds: 30
      enable-logging: true
  # Notification Client Configuration
  notification:
    client:
      url: ${NOTIFICATION_SERVICE_URL:http://localhost:9003}
      kafka-topic: ${NOTIFICATION_KAFKA_TOPIC:notifications.bulk.v1}
      timeout: ${NOTIFICATION_TIMEOUT:15} # in seconds
      kafka:
        enabled: false
      enabled: true

# Also enable DEBUG logging for the BRNetClient
logging:
  level:
    ke.shiva.corebanking.provider.brnet.BRNetClient: DEBUG
    ke.shiva.client.notification: DEBUG
