springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  redoc:
    enabled: true
    path: /redoc
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
  show-actuator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always


server:
  port: 9001