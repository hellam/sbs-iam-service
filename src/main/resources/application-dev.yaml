springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  redoc:
    enabled: true
    path: /redoc
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
    try-it-out-enabled: true
    defaultModelsExpandDepth: -1
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
#logging:
#  level:
#    org.hibernate.orm.mapping: DEBUG
#    org.hibernate.boot.model.internal: DEBUG

server:
  port: 9001

seeder:
  employee:
    enabled: true  # Enable employee seeder to create admin user
  customer:
    enabled: false # Disabled: customers should be onboarded via onboarding flow
  policy:
    enabled: true
  security-question:
    enabled: true
  corporate:
    enabled: false # Disabled: organizations and organization users should be onboarded
    default-password: "ChangeMe123!"
    reset-password-on-run: true
    organization:
      core-customer-id: "101058"
      legal-name: "SHIVA SOFTWARES AFRICA LTD"
      display-name: "SHIVA SOFTWARES AFRICA LTD"
      customer-segment: "CORPORATE"
      registration-no: "SHIVA-101058"
      country-code: "KE"
      city: "Nairobi"
      address: "Nairobi, Kenya"
      company-email: "ops@shiva.test"
      company-phone: "+254700101058"
    roles:
      maker:
        name: "Inputter"
        description: "Initiates and submits corporate transactions."
      checker:
        name: "Verifier"
        description: "Reviews and verifies submitted corporate transactions."
      approver:
        name: "Authorizer"
        description: "Performs final transaction approval."

security:
  allowed-domains:
    map:
      BACKOFFICE:
        - "${GW_ADDRESS}"
        - "localhost"
      INTERNET_BANKING:
        - "${GW_ADDRESS}"
        - "localhost"
      MOBILE_BANKING:
        - "localhost:44000"

shiva:
  api-doc:
    servers: http://localhost:${server.port}${spring.mvc.servlet.path},${GW_ADDRESS}${spring.mvc.servlet.path}
  notification:
    dev-email-recipient: ${IAM_DEV_NOTIFICATION_EMAIL:ibrahimamwayi72@gmail.com}
